<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ChatnMates</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="authOverlay" class="auth-overlay">
    <div class="auth-card">
      <h1>ChatnMates Login</h1>
      <p class="auth-subline">Registrieren oder mit bestehendem Account anmelden</p>
      <form id="authForm" class="auth-form">
        <label for="usernameInput">Username</label>
        <input id="usernameInput" type="text" maxlength="30" placeholder="z. B. lukes1" required />
        <label for="passwordInput">Passwort</label>
        <input id="passwordInput" type="password" minlength="6" maxlength="100" placeholder="Mindestens 6 Zeichen" required />
        <div class="auth-actions">
          <button id="loginBtn" type="submit" data-mode="login">Login</button>
          <button id="registerBtn" type="submit" data-mode="register">Registrieren</button>
        </div>
      </form>
      <div id="authError" class="auth-error"></div>
    </div>
  </div>

  <div class="app is-hidden" id="appRoot">
    <aside class="sidebar">
      <div class="brand">ChatnMates</div>
      <div class="me" id="meLabel">Verbinde...</div>
      <button id="logoutBtn" class="logout-btn">Logout</button>
      <form id="addContactForm" class="add-contact-form">
        <input id="addContactInput" type="text" maxlength="30" placeholder="Kontakt-Username" />
        <button type="submit">Hinzufuegen</button>
      </form>
      <div id="contactFeedback" class="contact-feedback"></div>
      <h3>Anfragen</h3>
      <ul id="requestList" class="request-list"></ul>
      <h3>Gruppen</h3>
      <form id="groupForm" class="group-form">
        <input id="groupNameInput" type="text" maxlength="40" placeholder="Gruppenname" />
        <input id="groupMembersInput" type="text" maxlength="200" placeholder="Mitglieder (Comma-separiert)" />
        <button type="submit">Gruppe erstellen</button>
      </form>
      <div id="groupFeedback" class="contact-feedback"></div>
      <ul id="groupsList" class="request-list"></ul>
      <h3>Kontakte</h3>
      <ul id="contacts" class="contacts"></ul>
    </aside>

    <main class="main">
      <div class="main-tabs">
        <button id="chatTabBtn" class="tab-btn active" type="button">Chats</button>
        <button id="statusTabBtn" class="tab-btn" type="button">Status</button>
      </div>
      <header class="chat-header">
        <div id="chatTitle">Kontakt wählen</div>
        <div class="call-actions">
          <button id="deleteContactBtn" disabled>Kontakt loeschen</button>
          <button id="clearChatBtn" disabled>Chat leeren</button>
          <button id="audioCallBtn" disabled>Anruf</button>
          <button id="videoCallBtn" disabled>Video</button>
          <button id="hangupBtn" disabled>Auflegen</button>
        </div>
      </header>

      <section id="chatView">
        <section id="messages" class="messages"></section>

        <form id="chatForm" class="chat-form">
          <button id="chatImageBtn" class="icon-circle-btn" type="button" title="Bild senden" aria-label="Bild senden">📷</button>
          <input id="chatImageInput" class="file-input-hidden" type="file" accept="image/*" />
          <input id="chatInput" type="text" placeholder="Nachricht schreiben..." maxlength="2000" autocomplete="off" />
          <button type="submit">Senden</button>
        </form>
        <div class="emoji-bar" id="emojiBar">
          <button type="button" data-emoji="😀">😀</button>
          <button type="button" data-emoji="😂">😂</button>
          <button type="button" data-emoji="❤️">❤️</button>
          <button type="button" data-emoji="👍">👍</button>
          <button type="button" data-emoji="🔥">🔥</button>
        </div>
      </section>

      <section id="statusView" class="is-hidden">
        <h3>Status (1h)</h3>
        <form id="statusForm" class="status-form">
          <button id="statusImageBtn" class="icon-circle-btn" type="button" title="Status-Bild senden" aria-label="Status-Bild senden">📷</button>
          <input id="statusImageInput" class="file-input-hidden" type="file" accept="image/*" />
          <input id="statusInput" type="text" placeholder="Neuer Status..." maxlength="300" />
          <button type="submit">Posten</button>
        </form>
        <ul id="statusList" class="status-list"></ul>
      </section>
    </main>

    <aside class="status-panel">
      <button id="toggleGroupDetailsBtn" type="button" class="group-details-toggle" title="Gruppendetails" aria-label="Gruppendetails">☰</button>
      <div id="groupDetailsBox" class="group-details-box is-hidden">
        <div id="groupDetailsEmpty">Keine Gruppe ausgewaehlt</div>
        <div id="groupDetailsContent" class="is-hidden">
          <input id="groupDetailName" type="text" maxlength="40" placeholder="Gruppenname" />
          <textarea id="groupDetailDescription" rows="3" maxlength="300" placeholder="Beschreibung"></textarea>
          <button id="groupMetaSaveBtn" type="button">Gruppendaten speichern</button>
          <button id="groupLeaveBtn" type="button">Gruppe verlassen</button>
          <div class="group-member-add">
            <input id="groupAddMemberInput" type="text" maxlength="30" placeholder="Mitglied hinzufügen" />
            <button id="groupAddMemberBtn" type="button">Hinzufuegen</button>
          </div>
          <ul id="groupMembersList" class="status-list"></ul>
        </div>
      </div>

      <div class="media-box is-hidden" id="mediaBox">
        <div class="media-title">Call</div>
        <video id="localVideo" autoplay playsinline muted></video>
        <video id="remoteVideo" autoplay playsinline></video>
      </div>
    </aside>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js"></script>
</body>
</html>
