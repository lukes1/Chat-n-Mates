<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ChatnMates</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="authOverlay" class="auth-overlay">
    <div class="auth-card">
      <h1>ChatnMates Login</h1>
      <p class="auth-subline">Registrieren oder mit bestehendem Account anmelden</p>
      <form id="authForm" class="auth-form">
        <label for="usernameInput">Username</label>
        <input id="usernameInput" type="text" maxlength="30" placeholder="z. B. lukes1" required />
        <label for="passwordInput">Passwort</label>
        <input id="passwordInput" type="password" minlength="6" maxlength="100" placeholder="Mindestens 6 Zeichen" required />
        <div class="auth-actions">
          <button id="loginBtn" type="submit" data-mode="login">Login</button>
          <button id="registerBtn" type="submit" data-mode="register">Registrieren</button>
        </div>
      </form>
      <div id="authError" class="auth-error"></div>
    </div>
  </div>

  <div class="app is-hidden" id="appRoot">
    <aside class="sidebar">
      <div class="brand">ChatnMates</div>
      <div class="me" id="meLabel">Verbinde...</div>
      <button id="logoutBtn" class="logout-btn">Logout</button>
      <form id="addContactForm" class="add-contact-form">
        <input id="addContactInput" type="text" maxlength="30" placeholder="Kontakt-Username" />
        <button type="submit">Hinzufuegen</button>
      </form>
      <div id="contactFeedback" class="contact-feedback"></div>
      <h3>Anfragen</h3>
      <ul id="requestList" class="request-list"></ul>
      <h3>Kontakte</h3>
      <ul id="contacts" class="contacts"></ul>
    </aside>

    <main class="main">
      <header class="chat-header">
        <div id="chatTitle">Kontakt wählen</div>
        <div class="call-actions">
          <button id="audioCallBtn" disabled>Anruf</button>
          <button id="videoCallBtn" disabled>Video</button>
          <button id="hangupBtn" disabled>Auflegen</button>
        </div>
      </header>

      <section id="messages" class="messages"></section>

      <form id="chatForm" class="chat-form">
        <input id="chatInput" type="text" placeholder="Nachricht schreiben..." maxlength="2000" autocomplete="off" />
        <button type="submit">Senden</button>
      </form>
    </main>

    <aside class="status-panel">
      <h3>Status (24h)</h3>
      <form id="statusForm" class="status-form">
        <input id="statusInput" type="text" placeholder="Neuer Status..." maxlength="300" />
        <button type="submit">Posten</button>
      </form>
      <ul id="statusList" class="status-list"></ul>

      <div class="media-box">
        <div class="media-title">Call</div>
        <video id="localVideo" autoplay playsinline muted></video>
        <video id="remoteVideo" autoplay playsinline></video>
      </div>
    </aside>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js"></script>
</body>
</html>
