services:
  db:
    image: postgres:16-alpine
    container_name: chatnmates-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: chatnmates
      POSTGRES_USER: chatnmates
      POSTGRES_PASSWORD: chatnmates
    volumes:
      - chatnmates_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatnmates -d chatnmates"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: chatnmates-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 3000
      ENABLE_BOTS: "false"
      DATABASE_URL: postgres://chatnmates:chatnmates@db:5432/chatnmates
    ports:
      - "3000:3000"

volumes:
  chatnmates_db_data:
