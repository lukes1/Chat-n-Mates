databases:
  - name: chatnmates-db
    databaseName: chatnmates
    user: chatnmates
    plan: free

services:
  - type: web
    name: chatnmates
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 18
      - key: ENABLE_BOTS
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: chatnmates-db
          property: connectionString
